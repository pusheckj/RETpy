name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as the hosted app
      - name: Install dependencies
        run: pip install -r ui/requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -q
