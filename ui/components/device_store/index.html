<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>device-store</title>
</head>
<body>
<script>
/*
 * Browser-storage bridge for utils/device_store.py (Streamlit custom
 * component, plain JS, no build step).
 *
 * This iframe is served from the Streamlit app's own origin, so
 * window.localStorage / window.sessionStorage here ARE the app origin's
 * storage. It never makes a network request: its only channel is postMessage
 * to its same-origin parent (the Streamlit app frame), which relays values to
 * this browser's session.
 *
 * Four storage targets, each in its own try so one blocked store never hides
 * the others:
 *   tab    sessionStorage["retpy"]       this tab's inputs, always on, gone when the tab closes
 *   device localStorage["retpy"]         "Remember me": kept after the tab closes
 *   prefs  localStorage["retpy-prefs"]   display choices (theme, font, simulation count), no inputs
 *   view   sessionStorage["mcView"]      read only here: {scrollY, tabs:{group: label}}, written by the page script
 *
 * Render args (from Python):
 *   storage_key  base key ("retpy")
 *   read_token   reader instance only: read once per distinct token and post
 *                {kind:"read", token, ok, tab, device, prefs, view_client, narrow}
 *                where tab/device/prefs are {ok:true, raw} or {ok:false, error}
 *   op           writer instance only, applied once per distinct sig:
 *                {kind:"set", sig, tab?, device?, prefs?, drop_tab?, drop_device?}   (strings are written as is)
 *                {kind:"remove", sig, targets?}   (default: tab, device and view)
 *                Posts {kind:"write_error", sig, target, error} for a target that throws.
 *   scope        writer instance only: per-session id for the dedupe marker
 *
 * To avoid rerun loops it posts a value ONLY for a new read token or a failed
 * write, never because of a re-render or a successful write.
 */
(function () {
  "use strict";

  var ORIGIN = window.location.origin;
  // Same-origin only: the stored envelope must never be handed to a foreign
  // embedding page. An opaque ("null") origin cannot touch storage at all, so
  // in that case only error messages can ever be posted.
  var TARGET = ORIGIN && ORIGIN !== "null" ? ORIGIN : "*";
  var PREFS_SUFFIX = "-prefs";
  var VIEW_KEY = "mcView";
  var NARROW_QUERY = "(max-width: 1130px)";

  var readTokens = {};  // tokens already answered
  var lastSig = null;   // last op applied (or attempted)

  // The last applied op is also remembered per tab, scoped to the Streamlit
  // session (sessionStorage holds only "<scope>|<op hash>"), so if Streamlit
  // remounts this iframe it does not replay an old write over a newer one
  // made in another tab. A new session (page reload) never matches.
  function marker(storageKey) { return "device_store.applied." + storageKey; }
  function alreadyApplied(storageKey, stamp) {
    try { return window.sessionStorage.getItem(marker(storageKey)) === stamp; } catch (e) { return false; }
  }
  function markApplied(storageKey, stamp) {
    try { window.sessionStorage.setItem(marker(storageKey), stamp); } catch (e) { /* in-memory only */ }
  }

  function send(type, data) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in data) {
      if (Object.prototype.hasOwnProperty.call(data, k)) msg[k] = data[k];
    }
    window.parent.postMessage(msg, TARGET);
  }

  function setValue(value) {
    send("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  function errorName(e) {
    return String((e && (e.name || e.message)) || e || "Error");
  }

  function store(area) { return area === "session" ? window.sessionStorage : window.localStorage; }

  // ---- reading -----------------------------------------------------------

  function readTarget(area, key) {
    try { return { ok: true, raw: store(area).getItem(key) }; }
    catch (e) { return { ok: false, error: errorName(e) }; }
  }

  function readView() {
    try {
      var raw = window.sessionStorage.getItem(VIEW_KEY);
      var v = raw ? JSON.parse(raw) : null;
      return v && typeof v === "object" ? v : null;
    } catch (e) { return null; }
  }

  function isNarrow() {
    try { return !!window.parent.matchMedia(NARROW_QUERY).matches; } catch (e) { return null; }
  }

  function read(storageKey, token) {
    if (!token || readTokens[token]) return;
    readTokens[token] = true;
    var tab = readTarget("session", storageKey);
    var device = readTarget("local", storageKey);
    var prefs = readTarget("local", storageKey + PREFS_SUFFIX);
    var msg = { kind: "read", token: token, tab: tab, device: device, prefs: prefs,
                ok: !!(tab.ok || device.ok), view_client: readView(), narrow: isNarrow() };
    if (!msg.ok) msg.error = tab.error || device.error || "storage unavailable";
    setValue(msg);
  }

  // ---- writing -----------------------------------------------------------

  // A quota error retries once without the heaviest optional parts of the
  // envelope (pins, then the view state); inputs are never dropped.
  function slim(value) {
    try {
      var env = JSON.parse(value);
      if (env && env.payload) { delete env.payload.pins; delete env.payload.view; }
      return JSON.stringify(env);
    } catch (e) { return value; }
  }

  function writeTarget(sig, name, area, key, value) {
    try {
      try {
        store(area).setItem(key, value);
      } catch (e) {
        if (errorName(e).indexOf("Quota") < 0 && e && e.code !== 22) throw e;
        store(area).setItem(key, slim(value));
      }
    } catch (e) {
      setValue({ kind: "write_error", sig: sig, target: name, error: errorName(e) });
    }
  }

  function removeTarget(sig, name, area, key) {
    try { store(area).removeItem(key); }
    catch (e) { setValue({ kind: "write_error", sig: sig, target: name, error: errorName(e) }); }
  }

  function applyOp(storageKey, op, scope) {
    if (!op || !op.sig || op.sig === lastSig) return;
    lastSig = op.sig;
    var stamp = String(scope || "") + "|" + op.sig;
    if (alreadyApplied(storageKey, stamp)) return;
    if (op.kind === "set") {
      if (typeof op.tab === "string") writeTarget(op.sig, "tab", "session", storageKey, op.tab);
      else if (op.drop_tab) removeTarget(op.sig, "tab", "session", storageKey);
      if (typeof op.device === "string") writeTarget(op.sig, "device", "local", storageKey, op.device);
      else if (op.drop_device) removeTarget(op.sig, "device", "local", storageKey);
      if (typeof op.prefs === "string") writeTarget(op.sig, "prefs", "local", storageKey + PREFS_SUFFIX, op.prefs);
    } else if (op.kind === "remove") {
      var targets = Array.isArray(op.targets) && op.targets.length ? op.targets : ["tab", "device", "view"];
      if (targets.indexOf("tab") >= 0) removeTarget(op.sig, "tab", "session", storageKey);
      if (targets.indexOf("device") >= 0) removeTarget(op.sig, "device", "local", storageKey);
      if (targets.indexOf("view") >= 0) removeTarget(op.sig, "view", "session", VIEW_KEY);
    }
    markApplied(storageKey, stamp);
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    if (TARGET !== "*" && event.origin !== ORIGIN) return;
    var data = event.data;
    if (!data || data.type !== "streamlit:render") return;
    var args = data.args || {};
    if (typeof args.storage_key !== "string" || !args.storage_key) return;
    applyOp(args.storage_key, args.op, args.scope);
    read(args.storage_key, args.read_token);
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
